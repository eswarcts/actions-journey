name: context

on:
  push:

jobs:
  context:
    runs-on: ubuntu-latest

    steps:
      - name: Print context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "Event: ${{ github.event_name }}"
          echo "OS: ${{ runner.os }}"
