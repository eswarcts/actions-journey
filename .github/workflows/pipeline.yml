name: pipeline

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - id: ver
        run: echo "version=1.4.2" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - run: echo "Testing version"

  deploy:
    runs-on: ubuntu-latest
    needs: [build, test]

    steps:
      - run: echo "Deploying version ${{ needs.build.outputs.version }}"
